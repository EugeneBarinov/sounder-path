<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaPath ECDIS - Bathymetric Passage Planner</title>
    <script src="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.3.1/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="sidebar">
        <div class="panel-header">Vessel Parameters</div>
        <div class="control-group">
            <label for="vessel-profile">Vessel Profile</label>
            <select id="vessel-profile" class="vessel-select">
                <option value="custom">Custom</option>
                <option value="yacht" selected>Small Yacht (12m)</option>
                <option value="ferry">Ferry / Ro-Ro (80m)</option>
                <option value="cargo">Cargo Ship (150m)</option>
            </select>

            <label for="draft-slider">Static Draft <span class="val" id="draft-val">1.2m</span></label>
            <input type="range" id="draft-slider" min="0.5" max="4.0" step="0.1" value="1.2">
            
            <label for="speed-slider">Speed (Knots) <span class="val" id="speed-val">10 kts</span></label>
            <input type="range" id="speed-slider" min="0" max="30" step="1" value="10">
            
            <label for="ukc-slider">UKC Margin <span class="val" id="ukc-val">0.5m</span></label>
            <input type="range" id="ukc-slider" min="0.0" max="2.0" step="0.1" value="0.5">

            <label for="radius-slider">Turning Radius <span class="val" id="radius-val">50m</span></label>
            <input type="range" id="radius-slider" min="20" max="1000" step="10" value="50">

            <div class="metrics-grid">
                <div class="metric-box">
                    <span class="metric-label">Dyn. Draft</span>
                    <span class="metric-val val-warn" id="dynamic-draft-val">1.26m</span>
                </div>
                <div class="metric-box">
                    <span class="metric-label">Min Depth Req.</span>
                    <span class="metric-val val-danger" id="danger-val">1.76m</span>
                </div>
            </div>
        </div>

        <div class="panel-header">Navigational Constraints</div>
        <div class="control-group">
            <label class="checkbox-label" for="toggle-fairways">
                <span>Display Fairways & TSS</span>
                <input type="checkbox" id="toggle-fairways" checked>
            </label>
            <label class="checkbox-label" for="prioritize-fairways">
                <span>Prioritize Fairways</span>
                <input type="checkbox" id="prioritize-fairways" checked>
            </label>
        </div>

        <div class="panel-header">Route Planning</div>
        <div class="wp-container">
            <div class="wp wp-start">
                <div class="wp-indicator"></div>
                <span id="start-coord">A: Not set</span>
            </div>
            <div class="wp wp-goal">
                <div class="wp-indicator"></div>
                <span id="goal-coord">B: Not set</span>
            </div>
            
            <button id="clear-route" style="margin-top: 8px;">Clear Route</button>
            <div id="status"></div>
        </div>
    </div>

    <div id="map"></div>

    <div id="bottom-drawer">
        <div class="drawer-header">
            <div class="drawer-tabs">
                <button class="drawer-tab active" id="tab-profile-btn">📊 Bathymetric Profile</button>
                <button class="drawer-tab" id="tab-waypoints-btn">📋 Passage Plan (<span id="wp-badge">0 WP</span>)</button>
            </div>
            <div class="drawer-actions" id="export-actions" style="display: none;">
                <button class="export-btn" id="export-gpx-btn" title="Export standard GPX route">⬇ GPX</button>
                <button class="export-btn" id="export-rtz-btn" title="Export IEC 61174 RTZ route for ECDIS">⬇ RTZ (ECDIS)</button>
                <button class="drawer-toggle-btn" id="drawer-close-btn" title="Close Panel">✕</button>
            </div>
        </div>
        <div class="drawer-content">
            <div class="tab-pane active" id="pane-profile">
                <canvas id="depth-chart"></canvas>
            </div>
            <div class="tab-pane" id="pane-waypoints">
                <div class="table-scroll">
                    <table class="ecdis-table" id="passage-plan-table">
                        <thead>
                            <tr>
                                <th>WP</th>
                                <th>Latitude</th>
                                <th>Longitude</th>
                                <th>Course (°T)</th>
                                <th>Dist (NM)</th>
                                <th>Turn (°)</th>
                                <th>Radius (m)</th>
                                <th>Depth (m)</th>
                                <th>UKC (m)</th>
                            </tr>
                        </thead>
                        <tbody id="waypoints-tbody">
                            <!-- Injected dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
