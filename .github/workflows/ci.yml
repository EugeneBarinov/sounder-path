name: CI - Maritime Navigation Engine

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: "utf-8"
      SEAPATH_GEOTIFF_PATH: "data/raw/operational_sample.tif"
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12", "3.13" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt

      - name: Compile C++ native extension
        run: |
          python setup.py build_ext --inplace

      - name: Run test suite
        run: |
          python -m pytest tests/ -v

      - name: Verify benchmark execution
        run: |
          python scripts/benchmark.py

  docker-compose-test:
    name: Docker Compose Clean Startup Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build and Start Docker Compose (Demo Profile)
        run: |
          docker compose --profile demo up -d --build seapath-ecdis-demo

      - name: Wait for healthy service & verify health endpoint
        run: |
          docker compose --profile demo ps
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8001/api/health || true)
            if [ "$STATUS" = "200" ]; then
              echo "Service is healthy! HTTP 200 received."
              curl -s http://127.0.0.1:8001/api/health
              break
            fi
            echo "Waiting for service to start... ($i/30, status=$STATUS)"
            sleep 2
          done
          echo "Docker Compose status:"
          docker compose --profile demo ps
          echo "Docker Compose logs:"
          docker compose --profile demo logs
          if [ "$STATUS" != "200" ]; then
            echo "Failed: Service did not become healthy."
            exit 1
          fi

      - name: Tear down Docker Compose
        run: |
          docker compose --profile demo down -v


